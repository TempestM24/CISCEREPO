  // Theme state synced with localStorage

    const savedTheme = localStorage.getItem('theme');
    return savedTheme ? savedTheme : 'dark';
  });

  const [activeTab, setActiveTab] = React.useState('icse');

  const [calcCorner, setCalcCorner] = React.useState('br'); // 'tl', 'tr', 'bl', 'br'
  const [calcExpression, setCalcExpression] = React.useState('');
  const [calcResult, setCalcResult] = React.useState('0');
  const [calcAngleMode, setCalcAngleMode] = React.useState('deg'); // 'deg', 'rad'

  // Synchronize light/dark class on body and the Favicon / Logos
  React.useEffect(() => {
    const rootElement = document.documentElement;
    const faviconElement = document.getElementById('favicon');
    if (theme === 'dark') {
      rootElement.classList.add('dark');
    } else {
      rootElement.classList.remove('dark');
    }

    // Dynamically compute the logo/favicon source path based on selected class and theme
    const logoName = `${activeTab}-${theme === 'dark' ? 'dark' : 'light'}.png`;
    const logoPath = `${logoName}`;
    if (faviconElement) {
